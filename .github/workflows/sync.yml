name: Sync from Notion

on:
  schedule:
    # 每小時的第 17 分。刻意避開整點——整點是 GitHub 排程的尖峰，延遲會更嚴重。
    # 注意：實際觸發本來就會延遲 5–30 分鐘，這是 GitHub 排程的已知行為，不是設定問題。
    - cron: '17 * * * *'

  # 手動觸發。兩個用途：
  #   1. 在 Notion 改完想立刻看到效果，不必等下一輪 cron
  #   2. 保險用的逃生門——正常情況下心跳機制（見最後一步）就能避免排程被停用
  workflow_dispatch:

  # 改了同步邏輯就重跑一次，確認輸出沒被改壞。
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/sync.yml'

# 同時只跑一個。前一輪還沒跑完就又被觸發的話，等它跑完再跑，
# 不要取消——取消會留下寫到一半的 manual/ 目錄。
concurrency:
  group: notion-sync
  cancel-in-progress: false

permissions:
  contents: write

env:
  # 內容連續這麼多天沒變動，就推一個心跳 commit。
  # 目的是讓 repo 不要被 GitHub 判定為 inactive——public repo 連續 60 天
  # 沒有 commit 活動，排程會被自動停用，而且不會通知你。
  # 設 30 天是留一倍的安全邊際：就算某次心跳自己失敗了，下個月還有一次機會。
  HEARTBEAT_AFTER_DAYS: '30'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 20 已經 EOL。這裡跟 actions 的 runtime 是兩件事，
          # 但一起升掉比較省事。
          node-version: '22'

      # 同步腳本零相依套件，所以這裡沒有 npm ci —— 少一個會壞的環節。

      - name: 跑單元測試
        # 這裡刻意列出檔案而不是傳 test/ 目錄。Node 22 起，--test 的位置參數
        # 改當成 glob 樣式解讀，傳目錄會被當檔案去 require 而直接爆掉。
        # 讓 shell 展開成明確清單，Node 20/22 都吃，而且不會順便去執行
        # fake-notion.js、sample-manual.js 這兩個測試輔助模組。
        run: node --test test/*.test.js

      - name: 從 Notion 同步
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ vars.NOTION_ROOT_PAGE_ID }}
        run: node scripts/sync.js --quiet

      - name: 有實質變動才 commit（否則按需推心跳）
        run: |
          git config user.name 'notion-sync[bot]'
          git config user.email 'notion-sync[bot]@users.noreply.github.com'
          git add -A manual INDEX.json INDEX.md MANUAL.md search.json

          # 這道閘門是「不要每小時製造垃圾 commit」的關鍵。
          # 它能成立的前提是同步輸出必須是決定性的——所以 front-matter 裡
          # 沒有 synced_at 之類每次都變的欄位，見 scripts/lib/page-file.js。
          if ! git diff --cached --quiet; then
            echo "變動檔案："
            git diff --cached --name-status

            git commit -m "docs(notion): 同步手冊內容

          由 ${{ github.event_name }} 觸發。"
            git push
            exit 0
          fi

          echo "內容沒有變動"

          # 走到這裡表示手冊已經一段時間沒動了。閘門本身沒問題，
          # 但「太久沒有任何 commit」會讓 GitHub 停掉這個排程，
          # 於是同步就靜悄悄地死掉——所以偶爾推個心跳把時鐘歸零。
          days_idle=$(( ( $(date -u +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "距離上一次 commit：${days_idle} 天（門檻 ${HEARTBEAT_AFTER_DAYS} 天）"

          if [ "$days_idle" -lt "$HEARTBEAT_AFTER_DAYS" ]; then
            echo "還沒到門檻，跳過 commit"
            exit 0
          fi

          date -u +%Y-%m-%dT%H:%M:%SZ > .sync-heartbeat
          git add .sync-heartbeat
          git commit -m "chore(ci): 心跳 commit

          手冊內容已 ${days_idle} 天沒有變動。這個 commit 不含任何內容變更，
          只是為了避免排程被 GitHub 以 inactive 為由自動停用。"
          git push
